
spring.application.name=taxi_douala



# ===========================
# Configuration Taxi Manager
# ===========================

# Serveur
server.port=8080

# Base de données MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/taxi_douala?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Nom de l'application

# Logs
logging.level.cm.douala.taxi_manager=DEBUG
logging.level.org.hibernate.SQL=DEBUG



